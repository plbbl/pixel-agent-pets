<!doctype html>
<html lang="zh-CN">
<head>

  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' ipc: http://ipc.localhost; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' asset: http://asset.localhost; connect-src 'self' ipc: http://ipc.localhost; object-src 'none'; base-uri 'self'">

  <link rel="stylesheet" href="app.css">

<body>
  <main id="stage" aria-label="抱抱龙桌宠">
