name: One-command installers
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'const version=require("./package.json").version;if(process.env.RELEASE_TAG!==`v${version}`)throw Error("Release tag must match package.json version")'
      - run: npm ci
      - run: npm run build
      - run: npm run build:site
      - run: npm run check
      - run: npm test
      - run: npm run build:installer
      - uses: actions/upload-artifact@v4
        with:
          name: verified-installer
          path: |
            work/release/Pixel-Agent-Pets-Installer.tar.gz
            work/release/SHA256SUMS
      - name: Publish verified package
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" work/release/Pixel-Agent-Pets-Installer.tar.gz work/release/SHA256SUMS install.sh --clobber
          else
            gh release create "$RELEASE_TAG" work/release/Pixel-Agent-Pets-Installer.tar.gz work/release/SHA256SUMS install.sh --verify-tag --generate-notes --title "抱抱龙 Pets $RELEASE_TAG · 一键安装"
          fi
